name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Checkout repo
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: "3.14"

    - name: Check formatting
      run: |
        python -m pip install pyink==24.3.0
        pyink --check .

  build-and-test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.14"]
    steps:
    - name: Checkout repo
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tox

    - name: Test with tox
      run: |
        tox

  publish-pypi:
    name: Build and stage package to OSS Exit Gate (PyPI)
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Build distribution packages
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Authenticate to Google Cloud (OSS Exit Gate)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: Clean up stale releases from staging repo
        run: |
          packages=$(gcloud artifacts packages list \
              --project="oss-exit-gate-prod" \
              --location="us" \
              --repository="mobly--pypi" \
              --format="value(name)" 2>/dev/null)
          echo "${packages}" | xargs -r -I {} sh -c '
              package_name=$(basename "{}")
              echo "Deleting package: $package_name..."
              gcloud artifacts packages delete "{}" \
                  --project="oss-exit-gate-prod" \
                  --location="us" \
                  --repository="mobly--pypi" \
                  --quiet
          '
      - name: Stage distributions to OSS Exit Gate and upload manifest
        run: |
          python -m pip install --upgrade twine
          python -m twine upload \
            --repository-url "https://us-python.pkg.dev/oss-exit-gate-prod/mobly--pypi/" \
            -u oauth2accesstoken \
            -p "$(gcloud auth print-access-token)" \
            dist/*
          echo '{"publish_all": true}' > manifest.json
          gcloud storage cp manifest.json \
            "gs://oss-exit-gate-prod-projects-bucket/mobly/pypi/manifests/manifest-${{ github.run_id }}-${{ github.run_attempt }}.json"
